<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }
    input, textarea, button {
      padding: 10px;
      font-size: 14px;
    }
    .task-item {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .task-item.completed .task-title {
      text-decoration: line-through;
      color: #777;
    }
    .task-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    #status-message {
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Task Manager</h1>
  <p>Student ID: <span id="student-id">73740</span></p>

  <p>
    <a id="contribution-link" href="contribution.html">Go to Contributor Page</a>
  </p>

  <div id="status-message"></div>

  <form id="task-form">
    <input type="hidden" id="task-edit-id" value="">
    <input type="text" id="task-title" placeholder="Task title..." required>
    <textarea id="task-description" placeholder="Task description (optional)..."></textarea>
    <button type="submit" id="task-submit">Add Task</button>
  </form>

  <h2>Tasks</h2>
  <div id="task-list"></div>

  <script src="app.js"></script>
</body>
</html>
